name: Deploy HowToFishGames (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        # Only fires once the CLOUDFLARE_API_TOKEN secret is configured in the repo.
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@4.129.0 pages deploy . --project-name howtofishgames
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "0319b5a34ac9ec72788d13d5cf706846"
